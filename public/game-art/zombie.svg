<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 240" width="210" height="240">
  <title>Grumble – silly zombie, facing left</title>
  <g stroke="#1d2b14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back arm -->
    <path d="M128 112 l34 20" fill="none" stroke="#6b9c4b" stroke-width="14"/>
    <circle cx="166" cy="134" r="10" fill="#7fb05a"/>
    <!-- legs: one boot, one bare foot -->
    <path d="M92 172 l-8 34" fill="none" stroke="#6b9c4b" stroke-width="15"/>
    <path d="M122 172 l10 30" fill="none" stroke="#6b9c4b" stroke-width="15"/>
    <path d="M60 214 q0-12 14-12 h14 q6 0 6 8 v6 h-34z" fill="#5a3b24"/>
    <path d="M122 206 q10-6 24-2 q8 4 4 12 h-30z" fill="#9bc873"/>
    <path d="M132 214 v-4 M139 214 v-5 M146 214 v-4" stroke-width="3" fill="none"/>
    <!-- torn shorts -->
    <path d="M78 160 h62 l4 22 -10-6 -6 10 -10-8 -8 8 -8-8 -10 6z" fill="#7b5ea7"/>
    <!-- lanky torso + tattered shirt with tie -->
    <path d="M76 96 h66 l4 66 -10-8 -8 10 -10-10 -10 10 -10-10 -10 8z" fill="#f2ead3"/>
    <path d="M104 98 l-6 12 8 8 8-8 -6-12z M106 118 l-8 38 12 -4 4-34z" fill="#c62828"/>
    <path d="M130 130 l6 14" stroke="#a02a2a" stroke-width="3" fill="none"/>
    <!-- front arm reaching left -->
    <path d="M82 108 l-52 -10" fill="none" stroke="#6b9c4b" stroke-width="15"/>
    <circle cx="24" cy="97" r="11" fill="#7fb05a"/>
    <path d="M16 90 l-6 -5 M22 88 l-2 -8 M30 90 l2 -8" stroke-width="3" fill="none"/>
  </g>
  <!-- big silly tilted head -->
  <g transform="rotate(-9 100 62)">
    <g stroke="#1d2b14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M42 62 q0-48 58-48 q58 0 58 48 q0 36-58 36 q-58 0-58-36z" fill="#86bb5f"/>
      <!-- brain -->
      <path d="M64 28 q4-20 22-14 q14-10 26 0 q18-4 22 16 q-22-8-34 2 q-16-8-36-4z" fill="#f48fb1"/>
      <path d="M82 20 q6 8 0 12 M112 18 q-6 8 2 12" stroke="#c2185b" stroke-width="3" fill="none"/>
      <!-- bandage -->
      <path d="M112 30 l30 14 -6 10 -30-14z" fill="#fffde7" stroke-width="3.5"/>
      <!-- ear -->
      <path d="M156 60 q14-2 12 10 q-2 8-12 6z" fill="#86bb5f"/>
    </g>
    <!-- googly mismatched eyes (looking left, crossed) -->
    <g stroke="#1d2b14" stroke-width="4">
      <circle cx="74" cy="58" r="12" fill="#fffde7"/>
      <circle cx="112" cy="54" r="19" fill="#fffde7"/>
      <circle cx="80" cy="62" r="5" fill="#1d2b14" stroke="none"/>
      <circle cx="102" cy="60" r="8" fill="#1d2b14" stroke="none"/>
      <circle cx="99" cy="57" r="2.6" fill="#fff" stroke="none"/>
    </g>
    <path d="M60 42 q14-8 26 2 M92 30 q22 -6 36 8" stroke="#1d2b14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- wonky grin, buck tooth, long tongue -->
    <path d="M58 78 q30 20 62 -2 q-6 18-34 18 q-24 0-28-16z" fill="#4a0e0e" stroke="#1d2b14" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 80 h12 v13 h-12z" fill="#fffde7" stroke="#1d2b14" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M96 90 q-2 20 8 22 q10 -2 6 -22z" fill="#ef6f8a" stroke="#1d2b14" stroke-width="4" stroke-linejoin="round"/>
    <path d="M103 94 v12" stroke="#c2185b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- drool -->
  <path d="M60 100 q-3 10 0 14 q4-4 0-14z" fill="#b2ebf2" stroke="#1d2b14" stroke-width="2.5"/>
</svg>
